entity.bunny_stream_library.collection:
  path: '/admin/config/services/bunny-stream'
  defaults:
    _entity_list: 'bunny_stream_library'
    _title: 'Bunny stream libraries'
  requirements:
    _permission: 'administer bunny_stream_library'

entity.bunny_stream_library.add_form:
  path: '/admin/config/services/bunny-stream/library/add'
  defaults:
    _entity_form: 'bunny_stream_library.add'
    _title: 'Add a Bunny stream library'
  requirements:
    _permission: 'administer bunny_stream_library'

entity.bunny_stream_library.edit_form:
  path: '/admin/config/services/bunny-stream/library/{bunny_stream_library}'
  defaults:
    _entity_form: 'bunny_stream_library.edit'
    _title: 'Edit a Bunny stream library'
  requirements:
    _permission: 'administer bunny_stream_library'

entity.bunny_stream_library.delete_form:
  path: '/admin/config/services/bunny-stream/library/{bunny_stream_library}/delete'
  defaults:
    _entity_form: 'bunny_stream_library.delete'
    _title: 'Delete a Bunny stream library'
  requirements:
    _permission: 'administer bunny_stream_library'

bunny_stream.webhook:
  path: '/bunny-stream/webhook'
  defaults:
    _controller: '\Drupal\bunny_stream\Controller\WebhookController::webhook'
  methods: ['POST']
  requirements:
    _custom_access: '\Drupal\bunny_stream\Controller\WebhookController::access'
  options:
    no_cache: TRUE

entity.media.bunny_stream_upload:
  path: '/media/{media}/upload'
  defaults:
    _controller: '\Drupal\bunny_stream\Controller\UploadController::page'
    _title: 'Upload video'
  requirements:
    _entity_access: 'media.update'
    _custom_access: '\Drupal\bunny_stream\Controller\UploadController::access'
    media: \d+
  options:
    _admin_route: TRUE
    parameters:
      media:
        type: entity:media

bunny_stream.media_upload_signature:
  path: '/media/{media}/upload/signature'
  defaults:
    _controller: '\Drupal\bunny_stream\Controller\UploadController::signature'
  methods: ['POST']
  requirements:
    _entity_access: 'media.update'
    _custom_access: '\Drupal\bunny_stream\Controller\UploadController::access'
    _csrf_request_header_token: 'TRUE'
    media: \d+
  options:
    no_cache: TRUE
    parameters:
      media:
        type: entity:media

bunny_stream.embed:
  path: '/bunny-stream/embed/{media}'
  defaults:
    _controller: '\Drupal\bunny_stream\Controller\EmbedController::embed'
  methods: ['GET']
  requirements:
    _entity_access: 'media.view'
    _custom_access: '\Drupal\bunny_stream\Controller\EmbedController::access'
    media: \d+
  options:
    _htmx_route: TRUE
    no_cache: TRUE
    parameters:
      media:
        type: entity:media
